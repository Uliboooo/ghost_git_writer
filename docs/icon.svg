<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Lavender Rounded Square -->
  <rect width="512" height="512" rx="100" fill="#b3b7e2"/>
  
  <!-- Ghost Body: Perfect dome head and 3 deep waves -->
  <path d="M256 95 
           C180 95 125 145 125 240 
           C125 320 90 390 65 415 
           Q125 465 190 415
           Q255 465 320 415
           Q385 465 450 415
           C425 390 387 320 387 240
           C387 145 332 95 256 95 Z" 
        fill="#ffffff"/>

  <!-- Ghost Face -->
  <circle cx="215" cy="205" r="18" fill="#000000"/>
  <circle cx="297" cy="205" r="18" fill="#000000"/>
  <path d="M225 250 Q256 275 287 250" stroke="#000000" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Git Diamond -->
  <g transform="translate(190, 370) rotate(45)">
    <rect x="-85" y="-85" width="170" height="170" rx="20" fill="#f05032"/>
    <g transform="rotate(-45)">
      <path d="M0 55 V-55" stroke="#ffffff" stroke-width="15" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="55" r="12" fill="#ffffff" stroke="none"/>
      <circle cx="0" cy="-55" r="12" fill="#ffffff" stroke="none"/>
      <path d="M0 15 C-35 15 -40 5 -40 -30" stroke="#ffffff" stroke-width="15" fill="none" stroke-linecap="round"/>
      <circle cx="-40" cy="-30" r="12" fill="#ffffff" stroke="none"/>
      <path d="M0 -10 C20 -10 25 -15 25 -35" stroke="#ffffff" stroke-width="11" fill="none" stroke-linecap="round"/>
      <circle cx="25" cy="-35" r="9" fill="#ffffff" stroke="none"/>
    </g>
  </g>

  <!-- Fountain Pen -->
  <g transform="translate(390, 275) rotate(225)">
    <rect x="-14" y="-120" width="28" height="160" rx="5" fill="#2d3436"/>
    <rect x="-17" y="25" width="34" height="30" fill="#636e72"/>
    <path d="M-15 55 L0 100 L15 55 Z" fill="#ffffff"/>
    <path d="M0 55 V85" stroke="#2d3436" stroke-width="2"/>
  </g>
  
  <!-- Ghost Hand -->
  <circle cx="370" cy="295" r="28" fill="#ffffff"/>
</svg>
